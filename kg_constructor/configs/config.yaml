# =========================================================
# Knowledge Graph construction configuration
# =========================================================

project:
  name: drug-recommender-kg
  seed: 42

# ---------------------------------------------------------
# Paths (relative to repository root)
# ---------------------------------------------------------
paths:
  kg_root: "kg_constructor"
  input_dir: "kg_constructor/data/input"
  output_dir: "kg_constructor/data/output"
  processed_dir: "kg_constructor/data/processed"

# ---------------------------------------------------------
# Input data configuration
# ---------------------------------------------------------
inputs:
  # Path to the original ZIP file.
  # Only required if you want to run a future unpack step.
  zip_path: "data-input.zip"

  # Directory containing the entity JSON files generated by MedJsonify.
  # Expected subfolders:
  #   - xml_files/
  #   - txt_files/
  #   - csv_files/
  medjsonify_entities_dir: "external/medjsonify/NER/data/entities"

# ---------------------------------------------------------
# Pipeline definition (execution order)
# ---------------------------------------------------------
pipeline:
  steps:
    - "00_import_data"
    - "01_stats"
    - "02_parse_sources"
    - "03_resolve_entities"
    - "04_build_triples"
    - "05_filter_graph"

# ---------------------------------------------------------
# Filtering rules (used in 05_filter_graph)
# ---------------------------------------------------------
filters:
  remove_obsolete_doid_labels: true
  # Keep HAS_INGREDIENT relations in the full biomedical graph.
  # Use false when the downstream model should learn from structural drug information too.
  remove_has_ingredient: false

  # Generic disease blacklist is loaded from:
  # kg_constructor/configs/blacklist.txt

# ---------------------------------------------------------
# Entity resolution options (used in 03_resolve_entities)
# ---------------------------------------------------------
entity_resolution:
  # Resolution order for drug entities:
  # 1. DRUGBANK:<id>, when prefer_drugbank_id is true and a DrugBank ID exists.
  # 2. CHEBI:<id>, when prefer_chebi_id is true and a ChEBI ID exists.
  # 3. DRUG:<NORMALIZED_NAME>, fallback when no enabled external ID exists.
  prefer_drugbank_id: true
  prefer_chebi_id: true

