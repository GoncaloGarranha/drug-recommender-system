# Compatibilidade: kg_root na raiz
kg_root: "kg_constructor"
# =========================================================
# Knowledge Graph construction configuration
# =========================================================

project:
  name: drug-recommender-kg
  seed: 42

# ---------------------------------------------------------
# Paths (relative to repository root)
# ---------------------------------------------------------
paths:
  kg_root: "kg_constructor"
  input_dir: "kg_constructor/data/input"
  output_dir: "kg_constructor/data/output"
  processed_dir: "kg_constructor/data/processed"

# ---------------------------------------------------------
# Input data configuration
# ---------------------------------------------------------
inputs:
  # Path to the original ZIP file.
  # Only required if you want to run step 00_unpack.
  zip_path: "data-input.zip"

# ---------------------------------------------------------
# Pipeline definition (execution order)
# ---------------------------------------------------------
pipeline:
  steps:
    - "00_unpack"
    - "01_stats"
    - "02_parse_sources"
    - "03_resolve_entities"
    - "04_build_triples"
    - "05_filter_graph"
    - "06_split_edges"
    - "07_index_dgl"
    - "08_analytics"

# ---------------------------------------------------------
# Train / validation / test split configuration
# (used in 06_split_edges)
# ---------------------------------------------------------
split:
  train: 0.8
  valid: 0.1
  test: 0.1

  prediction_relations:
    - "INDICATION"
    - "CONTRAINDICATION"
  structural_relations:
    - "HAS_INGREDIENT"

# ---------------------------------------------------------
# Filtering rules (used in 05_filter_graph)
# ---------------------------------------------------------
filters:
  remove_obsolete_doid_labels: true

  # Very generic diseases that should be removed
  generic_doid_blacklist:
    - "DOID:4"        # disease

# ---------------------------------------------------------
# Entity resolution options (used in 03_resolve_entities)
# ---------------------------------------------------------
entity_resolution:
  prefer_drugbank_id: true
  prefer_chebi_id: true
