project:
  name: drug-recommender-kg
  seed: 42
paths:
  kg_root: kg_constructor
  input_dir: kg_constructor/data/input
  output_dir: kg_constructor/data/graph_builds/identifier_preserving_reference
  processed_dir: kg_constructor/data/processed
inputs:
  zip_path: data-input.zip
  medjsonify_entities_dir: external/medjsonify/NER/data/entities
pipeline:
  steps:
  - 06_add_gene_associations
  - 11_build_drug_gene_targets
  - 12_quality_gate
filters:
  remove_obsolete_doid_labels: true
  remove_has_ingredient: false
  blacklist_path: kg_constructor/configs/disease_filters/historical_generic_diseases.txt
  blacklist_scope: destination_only
  contraindication_policy: keep_all
entity_resolution:
  prefer_drugbank_id: true
  prefer_chebi_id: true
gene_associations:
  enabled: true
  mode: historical_exact
  input_triples_path: kg_constructor/data/snapshots/commit_23379f59/triples.csv
  output_dir: kg_constructor/data/graph_builds/identifier_preserving_reference/gene_associations
  output_triples_path: kg_constructor/data/graph_builds/identifier_preserving_reference/triples/triples_with_genes.csv
  top_k_genes_per_disease: 25
  min_score: 0.1
  diseases_for_genes_path: kg_constructor/data/snapshots/commit_5a6a8bbd/diseases_for_genes.csv
drug_similarity:
  enabled: true
  input_path: kg_constructor/data/graph_builds/identifier_preserving_reference/triples/triples.filtered.csv
  source_relation: HAS_INGREDIENT
  jaccard_threshold: 0.5
  min_shared_features: 1
  output_path: kg_constructor/data/processed/drug_similarity_groups.json
  report_path: kg_constructor/data/graph_builds/identifier_preserving_reference/reports/drug_similarity_groups_report.json
active_ingredients:
  enabled: true
  input_subdir: xml_files
  output_csv: interim/active_ingredients_raw.csv
  summary_json: interim/active_ingredients_summary.json
active_substance_groups:
  enabled: true
  input_csv: interim/active_ingredients_raw.csv
  output_csv: interim/drug_active_substance_groups.csv
  summary_json: interim/drug_active_substance_groups_summary.json
pharmacological_groups:
  enabled: true
  input_csv: interim/drug_active_substance_groups.csv
  output_csv: interim/drug_pharmacological_groups.csv
  summary_json: interim/drug_pharmacological_groups_summary.json
dgidb_interactions:
  enabled: true
  input_triples_path: kg_constructor/data/graph_builds/identifier_preserving_reference/triples/triples_with_genes.csv
  interactions_path: kg_constructor/data/external/dgidb/interactions.tsv
  output_dir: kg_constructor/data/graph_builds/identifier_preserving_reference/dgidb
  output_triples_path: kg_constructor/data/graph_builds/identifier_preserving_reference/triples/triples_with_dgidb.csv
  mapping_mode: historical_exact
  require_existing_gene: true
quality_gate:
  enabled: true
  input_triples_path: kg_constructor/data/graph_builds/identifier_preserving_reference/triples/triples_with_dgidb.csv
  blacklist_path: kg_constructor/configs/disease_filters/historical_generic_diseases.txt
  report_path: kg_constructor/data/graph_builds/identifier_preserving_reference/reports/quality_gate_report.json
  fail_on_duplicate_triples: true
  fail_on_self_loops: true
  fail_on_empty_fields: true
  fail_on_schema_errors: true
  fail_on_blacklisted_entities: false
  fail_on_contraindication_conflicts: false
  fail_on_bad_drugbank_urls: false
