seed: 42
data:
  triples_path: kg_constructor/data/builds/2025-10_to_2026-03/triples/triples_with_dgidb.csv
  processed_dir: models/rgcn/data/processed/disease_to_drug/six_months_random_split
model:
  add_inverse_edges: true
task:
  name: disease_to_drug
  target_relation: INDICATION
  query_entity_type: DISEASE
  candidate_entity_type: DRUG
  context_relations:
  - INDICATION
  - CONTRAINDICATION
  - HAS_INGREDIENT
  - ASSOCIATED_WITH_GENE
  - INTERACTS_WITH_GENE
split:
  mode: random
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
content_based:
  relations:
    ingredient: HAS_INGREDIENT
    drug_gene: INTERACTS_WITH_GENE
    disease_gene: ASSOCIATED_WITH_GENE
    contraindication: CONTRAINDICATION
  enabled_components:
    ingredient_knn: true
    direct_gene_knn: false
    train_indication_gene_knn: true
    disease_gene_overlap: false
    contraindication_knn: false
    direct_contraindication: false
    popularity: false
  aggregation:
    method: centroid
  weights:
    ingredient_knn: 0.5
    direct_gene_knn: 0.0
    train_indication_gene_knn: 0.5
    disease_gene_overlap: 0.0
    contraindication_knn: 0.0
    popularity: 0.0
    direct_contraindication: 0.0
runs:
  out_dir: results/runs/content-based
  experiment_name: six_months_publication_ingredient_gene_content_based
