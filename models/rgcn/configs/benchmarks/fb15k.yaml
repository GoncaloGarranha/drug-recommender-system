seed: 42

model:
  add_inverse_edges: true

data:
  triples_path: "kg_constructor/data/output/benchmarks/fb15k/triples.csv"
  processed_dir: "models/rgcn/data/processed/fb15k"

task:
  name: "tail_prediction"
  target_relation: null
  query_entity_type: "ALL"
  candidate_entity_type: "ALL"
  context_relations: "ALL"

split:
  mode: "official"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  # Heavy benchmark setting inspired by the external relation-prediction
  # GCN block setup: 500-dimensional embeddings, 2 R-GCN layers, dropout 0.2
  # and 10 negatives per positive. This is intended for final benchmark runs,
  # not for quick smoke tests.
  epochs: 1500
  max_epochs: 1500
  early_stopping:
    monitor: "valid_mrr"
    patience: 50
    mode: "max"

  lr: 0.01
  weight_decay: 0.01
  dropout: 0.2
  emb_dim: 500
  num_bases: 100
  num_layers: 2
  neg_k: 10
  corrupt_mode: "both"
  eval_every: 10
  hits_k: [1, 3, 10]
  device: "cpu"

runs:
  out_dir: "results/runs/rgcn"
  experiment_name: "fb15k_heavy"
