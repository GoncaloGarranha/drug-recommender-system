seed: 42
model:
  add_inverse_edges: true
data:
  triples_path: kg_constructor/data/benchmarks/hetionet_enriched/triples.csv
  processed_dir: models/rgcn/data/processed/hetionet_enriched
task:
  name: tail_prediction
  target_relation: null
  query_entity_type: ALL
  candidate_entity_type: ALL
  context_relations: ALL
split:
  mode: official
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
training:
  epochs: 10000
  max_epochs: 10000
  early_stopping:
    monitor: valid_mrr
    patience: 6000
    mode: max
  lr: 0.0001
  weight_decay: 0.0001
  dropout: 0.2
  emb_dim: 128
  num_bases: 5
  num_layers: 2
  neg_k: 50
  eval_every: 10
  eval_batch_size: 64
  hits_k:
  - 1
  - 3
  - 10
  device: cpu
  corrupt_mode: both
runs:
  out_dir: results/runs/rgcn
  experiment_name: hetionet_enriched_corrected
