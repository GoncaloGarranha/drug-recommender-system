seed: 42

experiment:
  name: rgcn_disease_to_drug_full
  model_family: R-GCN + DistMult
  task: disease_to_drug

data:
  triples_path: kg_constructor/data/output/triples/triples.csv
  processed_dir: models/rgcn/data/processed/disease_to_drug_full

model:
  add_inverse_edges: true

task:
  name: disease_to_drug
  target_relation: INDICATION
  query_entity_type: DISEASE
  candidate_entity_type: DRUG
  context_relations:
    - INDICATION
    - CONTRAINDICATION
    - HAS_INGREDIENT

split:
  mode: random
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  device: cpu
  max_epochs: 8000
  lr: 0.01clea
  weight_decay: 0.0
  dropout: 0.2
  emb_dim: 100
  num_bases: 10
  num_layers: 2
  neg_k: 10
  eval_every: 10
  hits_k:
    - 1
    - 3
    - 10
  early_stopping:
    monitor: valid_mrr
    patience: 6000
    mode: max

runs:
  out_dir: models/rgcn/runs/disease_to_drug_full

