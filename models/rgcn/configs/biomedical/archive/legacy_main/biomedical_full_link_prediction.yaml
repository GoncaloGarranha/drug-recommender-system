seed: 42

experiment:
  name: rgcn_biomedical_full_link_prediction
  model_family: R-GCN + DistMult
  task: generic_link_prediction

data:
  triples_path: kg_constructor/data/output/triples/triples.csv
  processed_dir: models/rgcn/data/processed/biomedical_full_link_prediction

model:
  add_inverse_edges: true

task:
  name: tail_prediction
  target_relation: null
  query_entity_type: ALL
  candidate_entity_type: ALL
  context_relations: ALL

split:
  mode: random
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  device: cpu
  max_epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  emb_dim: 128
  num_bases: 3
  num_layers: 2
  neg_k: 10
  eval_every: 10
  hits_k:
    - 1
    - 3
    - 10
  corrupt_mode: both
  early_stopping:
    monitor: valid_mrr
    patience: 20
    mode: max

runs:
  out_dir: results/runs/rgcn
  experiment_name: biomedical_full_link_prediction
