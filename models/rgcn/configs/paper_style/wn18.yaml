seed: 42

experiment:
  name: "rgcn_paper_style_wn18"
  model_family: "R-GCN + DistMult"
  reference: "Schlichtkrull et al. 2018"

model:
  encoder: "rgcn"
  decoder: "distmult"
  decomposition: "basis"
  add_inverse_edges: true

data:
  triples_path: "kg_constructor/data/output/benchmarks/wn18/triples.csv"
  processed_dir: "models/rgcn/data/processed/wn18"

task:
  name: "link_prediction"
  target_relation: null
  query_entity_type: "ALL"
  candidate_entity_type: "ALL"
  context_relations: "ALL"

split:
  mode: "official"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

evaluation:
  protocol: "filtered_ranking"
  prediction_directions: ["head", "tail"]

training:
  epochs: 300
  max_epochs: 300
  train_directions: ["head", "tail"]
  early_stopping:
    monitor: "valid_mrr"
    patience: 10
    mode: "max"
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  emb_dim: 128
  num_bases: 18
  num_layers: 2
  neg_k: 10
  eval_every: 10
  hits_k: [1, 3, 10]
  device: "cpu"

runs:
  out_dir: "models/rgcn/runs/benchmarks/wn18_head_tail"
