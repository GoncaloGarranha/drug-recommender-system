seed: 42
data:
  triples_path: kg_constructor/data/output/triples/triples.filtered.csv
  processed_dir: models/rgcn/data/processed/disease_to_drug
task:
  name: disease_to_drug
  target_relation: INDICATION
  query_entity_type: DISEASE
  candidate_entity_type: DRUG
  context_relations:
  - INDICATION
  - CONTRAINDICATION
split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
baseline:
  use_ingredients: false
training:
  epochs: 4000
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  emb_dim: 128
  num_bases: 3
  num_layers: 2
  neg_k: 50
  eval_every: 10
  hits_k:
  - 1
  - 3
  - 10
  device: cpu
runs:
  out_dir: models/rgcn/runs
