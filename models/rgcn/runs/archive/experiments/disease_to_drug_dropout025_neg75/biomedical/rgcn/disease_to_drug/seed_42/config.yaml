seed: 42
data:
  triples_path: kg_constructor/data/output/triples/triples.csv
  processed_dir: models/rgcn/data/processed/disease_to_drug_full
model:
  add_inverse_edges: true
task:
  name: disease_to_drug
  target_relation: INDICATION
  query_entity_type: DISEASE
  candidate_entity_type: DRUG
  context_relations:
  - INDICATION
  - CONTRAINDICATION
  - HAS_INGREDIENT
split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
training:
  epochs: 9000
  max_epochs: 9000
  early_stopping:
    monitor: valid_mrr
    patience: 800
    mode: max
  lr: 0.0001
  weight_decay: 0.00015
  dropout: 0.25
  emb_dim: 128
  num_bases: 3
  num_layers: 2
  neg_k: 75
  eval_every: 10
  hits_k:
  - 1
  - 3
  - 10
  device: cpu
runs:
  out_dir: models/rgcn/runs/experiments/disease_to_drug_dropout025_neg75
