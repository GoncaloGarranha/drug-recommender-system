seed: 42
model:
  add_inverse_edges: true
data:
  triples_path: kg_constructor/data/output/benchmarks/fb15k237/triples.csv
  processed_dir: models/rgcn/data/processed/fb15k237
task:
  name: tail_prediction
  target_relation: null
  query_entity_type: ALL
  candidate_entity_type: ALL
  context_relations: ALL
split:
  mode: official
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
training:
  epochs: 200
  max_epochs: 200
  early_stopping:
    monitor: valid_mrr
    patience: 8
    mode: max
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  emb_dim: 128
  num_bases: 30
  num_layers: 2
  neg_k: 5
  eval_every: 10
  hits_k:
  - 1
  - 3
  - 10
  device: cpu
runs:
  out_dir: models/rgcn/runs/benchmarks/fb15k237_tail
