seed: 42

experiment:
  name: "rgcn_benchmark_disease_to_drug"
  model_family: "R-GCN + DistMult"
  task: "generic_link_prediction"

model:
  add_inverse_edges: true
  regularizer: "basis"

data:
  triples_path: "kg_constructor/data/output/triples/triples.csv"
  processed_dir: "models/rgcn/data/processed/disease_to_drug_full"

split:
  mode: "random"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  max_epochs: 4000
  lr: 0.01
  weight_decay: 0.0
  dropout: 0.2
  emb_dim: 500
  num_bases: 5
  num_layers: 2
  neg_k: 10
  loss: "bce"
  decoder_l2: 0.01
  grad_clip_norm: 1.0
  graph_batch_size: 30000
  graph_split_size: 0.5
  graph_sampler: "neighborhood"
  eval_every: 2000
  max_iterations: 50000
  burnin_iterations: 6000
  progress_every: 50
  hits_k: [1, 3, 10]
  device: "cpu"
  max_eval_triples: null

runs:
  out_dir: "models/rgcn_benchmark/runs/biomedical_d2d"