seed: 42

experiment:
  name: "schlichtkrull_rgcn_fb15k"
  model_family: "R-GCN + DistMult"
  task: "generic_link_prediction"
  reference: "Schlichtkrull et al. 2018"

model:
  add_inverse_edges: true
  regularizer: "basis"

data:
  triples_path: "kg_constructor/data/output/benchmarks/fb15k/triples.csv"
  processed_dir: "models/rgcn/data/processed/fb15k"

split:
  mode: "official"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  epochs: 200
  max_epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  emb_dim: 128
  num_bases: 50
  num_layers: 2
  neg_k: 5
  eval_every: 10
  hits_k: [1, 3, 10]
  device: "cpu"
  # Optional smoke-test limiter. Remove or set null for full validation.
  max_eval_triples: null

runs:
  out_dir: "models/rgcn_schlichtkrull/runs/fb15k"
