seed: 42
data:
  triples_path: kg_constructor/data/output/benchmarks/hetionet_enriched/triples.csv
  processed_dir: models/rgcn/data/processed/hetionet_enriched
model:
  add_inverse_edges: true
task:
  name: disease_to_drug
  target_relation: INDICATION
  query_entity_type: DISEASE
  candidate_entity_type: DRUG
  context_relations:
  - INDICATION
  - SIMILAR_TO
  - BINDS_GENE
  - ASSOCIATED_WITH_GENE
split:
  mode: random
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
training:
  epochs: 5000
  max_epochs: 5000
  early_stopping:
    monitor: valid_mrr
    patience: 150
    mode: max
  lr: 0.0001
  weight_decay: 0.0001
  dropout: 0.3
  emb_dim: 128
  num_bases: 4
  num_layers: 2
  neg_k: 25
  eval_every: 10
  hits_k:
  - 1
  - 3
  - 10
  device: cpu
runs:
  out_dir: results/runs/rgcn
  experiment_name: hetionet_enriched
