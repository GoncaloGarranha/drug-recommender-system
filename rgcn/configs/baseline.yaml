seed: 42

data:
  processed_dir: "kg_constructor/data/processed"

training:
  epochs: 600            # Aumentamos para dar tempo à R-GCN
  lr: 0.001              # BAIXAR para estabilizar os scores
  weight_decay: 0.0001
  dropout: 0.2
  emb_dim: 128           # Aumentamos a "memória" do modelo
  num_bases: 3          # Desativamos bases para simplificar (o grafo é pequeno)
  num_layers: 2
  neg_k: 50
  eval_every: 10
  hits_k: [1, 3, 10]
  device: "cpu"

runs:
  out_dir: "rgcn/runs"
  name: "drug_to_disease_focused"